name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  # Test-only values; real secrets live in the hosting platform.
  DATABASE_URL: postgresql://vtmp:vtmp@localhost:5432/vtmp_test?schema=public
  TEST_DATABASE_URL: postgresql://vtmp:vtmp@localhost:5432/vtmp_test?schema=public
  JWT_SECRET: ci-access-secret-that-is-at-least-32-chars
  REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-chars
  PUBLIC_BASE_URL: http://localhost:5173
  CORS_ORIGINS: http://localhost:5173

jobs:
  quality:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @vtmp/web i18n:check
      # docs/TRACEABILITY.md must match the requirement IDs the code and tests cite.
      - run: pnpm docs:check

  unit:
    name: Unit tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  integration:
    name: Integration tests (PostgreSQL)
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vtmp
          POSTGRES_PASSWORD: vtmp
          POSTGRES_DB: vtmp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vtmp -d vtmp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to a clean database
        run: pnpm --filter @vtmp/api db:deploy
      - run: pnpm --filter @vtmp/api test:int

  build:
    name: Build + browser smoke test
    needs: [unit, integration]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vtmp
          POSTGRES_PASSWORD: vtmp
          POSTGRES_DB: vtmp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vtmp -d vtmp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # NFR-10: core student pages under 500 KB gzip on first load.
      - run: pnpm --filter @vtmp/web bundle:check
      # The browser tests drive the real API: give it config, a schema and seed accounts.
      # Job-level env (DATABASE_URL etc.) takes precedence over the copied .env values.
      - run: cp .env.example .env
      - run: pnpm --filter @vtmp/api db:deploy
      - run: pnpm db:seed
      - run: pnpm --filter @vtmp/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Vercel deploys main itself (GitHub integration; migrations run first in the production build,
  # scripts/vercel-build.sh). This job then checks the live site. It runs only once the repository
  # variable PUBLIC_BASE_URL is set (docs/internal/DEPLOYMENT.md), and E2E_PASSWORD is a secret.
  deployed-smoke:
    name: Smoke test the deployed site
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.PUBLIC_BASE_URL != ''
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for the API (free tier may be asleep)
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$E2E_BASE_URL/api/v1/health" && exit 0
            sleep 10
          done
          exit 1
      - run: pnpm --filter @vtmp/web exec playwright install --with-deps chromium
      # Read-only checks only: never create data on the live demo.
      # No retries: each retry repeats a sign-in, and a wrong E2E_PASSWORD would then trip the
      # 5-failure account lockout on the demo student (auth.maxFailedLogins).
      - run: pnpm --filter @vtmp/web exec playwright test smoke.spec.ts --project=desktop --retries=0
