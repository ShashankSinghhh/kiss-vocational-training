openapi: 3.0.3
info:
  title: KISS VTMP API
  version: 0.1.0
  description: |
    KISS Vocational Training Management Portal API. All endpoints live under /api/v1 and
    return JSON. Errors always use the Error schema below.

    A user whose password an admin set (a new account created with mustChangePassword, or a
    reset) gets 403 PASSWORD_CHANGE_REQUIRED on every signed-in route except GET /auth/me,
    POST /users/me/password, PATCH /users/me and GET /notifications/me until they choose their
    own password. The global request limit counts signed-in requests per user and anonymous
    ones per IP.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
tags:
  - name: system
  - name: auth
  - name: users
  - name: admin-users
  - name: catalogue
  - name: admin-courses
  - name: enrollments
  - name: admin-enrollments
  - name: notifications
  - name: batches
  - name: admin-batches
  - name: attendance
  - name: assessments
  - name: completion
  - name: certificates
  - name: reports
  - name: dashboard
  - name: competency
  - name: passport
  - name: public
  - name: intervention
  - name: audit
  - name: jobs
  - name: scheduling
  - name: evidence
  - name: opportunities
  - name: analytics
  - name: assistant
paths:
  /health:
    get:
      tags: [system]
      summary: Liveness and database check
      security: []
      responses:
        '200':
          description: App and database are healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password (BRQ-1.1)
      description: |
        Returns a 15-minute access token in the body and sets a 7-day refresh token in the
        httpOnly `vtmp_rt` cookie (path /api/v1/auth). Wrong email, wrong password and
        deactivated accounts all return the same 401. After `auth.maxFailedLogins` failures the
        account is locked for `auth.lockMinutes`; a locked account also gets that same 401
        INVALID_CREDENTIALS (whose message mentions the lock), so the answer never shows that
        an email exists. Admins can unlock it. Rate-limited per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie: { schema: { type: string }, description: Refresh token cookie }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and get a new access token
      description: |
        Uses the `vtmp_rt` cookie. Every call rotates the token. Presenting an already-rotated
        token revokes the whole token family (401 REFRESH_TOKEN_REUSED).
      security: []
      responses:
        '200':
          description: New session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current refresh token family and clear the cookie
      security: []
      responses:
        '204': { description: Signed out }
  /auth/me:
    get:
      tags: [auth]
      summary: The signed-in user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me:
    patch:
      tags: [users]
      summary: Update own profile (BRQ-1.3)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /users/me/password:
    post:
      tags: [users]
      summary: Change own password (BRQ-1.3)
      description: Verifies the current password and signs out every other session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: At least one letter and one digit.
      responses:
        '204': { description: Password changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/users:
    get:
      tags: [admin-users]
      summary: List users (Admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - {
            name: q,
            in: query,
            schema: { type: string },
            description: 'Search name, email, roll no or employee code',
          }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: isActive, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin-users]
      summary: Create a student, trainer or admin account (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/users/bulk-status:
    post:
      tags: [admin-users]
      summary: Deactivate or reactivate several users at once (Admin)
      description: >-
        One transaction with one audit row per changed record; an unknown id rolls it all back
        (404). Records already in the requested state are left alone. Accepts Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, isActive]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, format: uuid }
                isActive: { type: boolean }
      responses:
        '200':
          description: Number of records changed
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/users/{id}:
    patch:
      tags: [admin-users]
      summary: Rename, change locale, deactivate or reactivate a user (Admin)
      description: >-
        Deactivation revokes every session. Admins cannot deactivate themselves (409), nor the
        only trainer of a planned or active batch (409 TRAINER_STILL_NEEDED; assign another
        trainer first).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                fullName: { type: string }
                isActive: { type: boolean }
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [admin-users]
      summary: Permanently delete an account that has no history (Admin)
      description: >-
        For accounts created by mistake. Anything with activity (applications, training records,
        decisions, audit entries) is refused with 409 USER_IN_USE and can only be deactivated.
        Admins cannot delete themselves (409 CANNOT_DELETE_SELF).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users/{id}/unlock:
    post:
      tags: [admin-users]
      summary: Clear a login lock so the user can sign in again at once (Admin)
      description: Audited as USER_UNLOCKED with the lock that was cleared.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Unlocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/users/{id}/password:
    post:
      tags: [admin-users]
      summary: Set a new password for a user who forgot theirs (Admin)
      description: >-
        Also clears any login lock and revokes every session, so only the new password works.
        Audited as USER_PASSWORD_RESET without the password. Admins change their own password
        under /users/me/password (409 CANNOT_RESET_OWN_PASSWORD here).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: At least one letter and one digit.
                mustChangePassword:
                  type: boolean
                  default: true
                  description: Ask the user to choose their own password at next sign-in.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  # ─── Sprint 3: catalogue, courses, cycles, enrollment ─────────────────────────
  /courses:
    get:
      tags: [catalogue]
      summary: Course catalogue for a cycle (BRQ-2.2)
      description: >-
        Active courses offered in the cycle (default the newest cycle with offerings), with
        window state and indicative seats remaining. Once a course has batches in the cycle,
        seatCapacity is the total of their capacities; until then it is the course's planned
        capacity.
      parameters:
        - { name: cycleId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  cycle: { $ref: '#/components/schemas/Cycle' }
                  courses: { type: array, items: { $ref: '#/components/schemas/CatalogueCourse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /courses/{id}:
    get:
      tags: [catalogue]
      summary: One catalogue course in a cycle
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cycleId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Course and cycle }
        '404': { $ref: '#/components/responses/NotFound' }
  /cycles:
    get:
      tags: [catalogue]
      summary: 'Training cycles a student can choose on the Courses page (BRQ-2.2): offering at least one active course and not yet ended. Nothing is pre-selected.'
      description: >-
        Each cycle carries applications (OPEN, UPCOMING or CLOSED: whether any of its courses'
        windows is open, will open, or neither). Cycles taking applications come first, then
        upcoming, then closed; newest first within each (L7).
      responses:
        '200':
          description: Cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Cycle'
                    - type: object
                      properties:
                        applications: { type: string, enum: [OPEN, UPCOMING, CLOSED] }

  /admin/courses:
    get:
      tags: [admin-courses]
      summary: All courses incl. inactive (Admin)
      description: >-
        Each course carries inUse - planned or running batches, students placed in them and
        open enrollment windows - so the admin sees what deactivating it would affect.
      responses:
        { '200': { description: Courses }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [admin-courses]
      summary: Create a course (Admin, BRQ-2.1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, title, description, durationWeeks, seatCapacity]
              properties:
                code: { type: string, pattern: '^[A-Za-z0-9-]{2,20}$' }
                title: { type: string }
                description: { type: string }
                durationWeeks: { type: integer, minimum: 1 }
                prerequisites: { type: string, nullable: true }
                prerequisitesNeedReview:
                  type: boolean
                  default: true
                  description: Automatic approval waits for a person to check the prerequisites.
                seatCapacity: { type: integer, minimum: 1 }
      responses:
        '201': { description: Created }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/courses/bulk-status:
    post:
      tags: [admin-courses]
      summary: Deactivate or reactivate several courses (BRQ-2.1) at once (Admin)
      description: >-
        One transaction with one audit row per changed record; an unknown id rolls it all back
        (404). Records already in the requested state are left alone. Accepts Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, isActive]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, format: uuid }
                isActive: { type: boolean }
      responses:
        '200':
          description: Number of records changed
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/courses/{id}:
    patch:
      tags: [admin-courses]
      summary: Update a course; isActive=false is the soft delete (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        { '200': { description: Updated }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [admin-courses]
      summary: Permanently delete a course nothing refers to yet (Admin, BRQ-2.1)
      description: >-
        For courses created by mistake. A course that has been offered, applied for or taught is
        refused with 409 COURSE_IN_USE and can only be deactivated.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/cycles:
    get:
      tags: [admin-courses]
      summary: Training cycles (Admin)
      responses: { '200': { description: Cycles } }
    post:
      tags: [admin-courses]
      summary: Create a training cycle (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, startsOn, endsOn]
              properties:
                name: { type: string }
                startsOn: { type: string, format: date }
                endsOn: { type: string, format: date }
      responses:
        { '201': { description: Created }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/cycles/{id}:
    patch:
      tags: [admin-courses]
      summary: Rename or re-date a cycle (Admin)
      description: >-
        409 CYCLE_HAS_BATCHES_OUTSIDE or CYCLE_HAS_WINDOWS_OUTSIDE (details name them) when the
        new dates would leave a batch or an application window outside the cycle (L5, L6).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        { '200': { description: Updated }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/cycles/{cycleId}/offerings:
    get:
      tags: [admin-courses]
      summary: Every course with its offering (if any) in the cycle (Admin)
      parameters:
        - { name: cycleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Course + offering pairs } }
  /admin/cycles/{cycleId}/offerings/{courseId}:
    put:
      tags: [admin-courses]
      summary: Offer a course in a cycle, set its enrollment window and open/close toggle (BRQ-2.3)
      description: >-
        422 WINDOW_AFTER_CYCLE when the window closes after the cycle's last day (midnight,
        institution time, L6). Opening after the cycle has started is allowed.
      parameters:
        - { name: cycleId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollmentOpensAt, enrollmentClosesAt, isOpen]
              properties:
                enrollmentOpensAt: { type: string, format: date-time }
                enrollmentClosesAt: { type: string, format: date-time }
                isOpen: { type: boolean }
      responses:
        '200':
          description: Offering
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offering' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /enrollments:
    post:
      tags: [enrollments]
      summary: Apply with 1–3 ranked course preferences (Student, BRQ-3.1)
      description: |
        BR-02: every chosen course must be active with its window open now, else 409
        ENROLLMENT_WINDOW_CLOSED. BR-01: one active application per cycle, else 409
        DUPLICATE_ENROLLMENT. Preference count is limited by setting enrollment.maxPreferences
        (422 TOO_MANY_PREFERENCES). A student already approved, allocated or in training in
        another cycle whose dates overlap gets 409 OVERLAPPING_TRAINING. Accepts Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycleId, courseIds]
              properties:
                cycleId: { type: string, format: uuid }
                courseIds:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  description: In rank order (first = first preference)
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: Submitted (PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /enrollments/me:
    get:
      tags: [enrollments]
      summary: My applications with status timeline (Student, BRQ-3.4)
      responses: { '200': { description: 'Applications, newest first' } }
  /enrollments/{enrollmentId}:
    put:
      tags: [enrollments]
      summary: Replace preferences while PENDING and windows open (Student, own)
      parameters:
        - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /enrollments/{enrollmentId}/withdraw:
    post:
      tags: [enrollments]
      summary: Withdraw a PENDING application while windows are open (Student, own)
      parameters:
        - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: WITHDRAWN }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/enrollments:
    get:
      tags: [admin-enrollments]
      summary: Review queue, newest first (Admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: cycleId, in: query, schema: { type: string, format: uuid } }
        - {
            name: courseId,
            in: query,
            schema: { type: string, format: uuid },
            description: Any preference,
          }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EnrollmentStatus' } }
        - {
            name: q,
            in: query,
            schema: { type: string },
            description: 'Student name, email or roll no',
          }
      responses: { '200': { description: Page of applications with student details } }
  /admin/enrollments/{id}/approve:
    post:
      tags: [admin-enrollments]
      summary: Approve (Admin, BRQ-3.3). Audited, notifies the student.
      description: >-
        409 OVERLAPPING_TRAINING when the student is already approved, allocated or in training
        in another cycle whose dates overlap.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: APPROVED }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/enrollments/{id}/reject:
    post:
      tags: [admin-enrollments]
      summary: Reject with a required reason (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [reason],
                properties: { reason: { type: string, minLength: 3 } },
              }
      responses:
        {
          '200': { description: REJECTED },
          '422': { $ref: '#/components/responses/ValidationFailed' },
        }
  /admin/enrollments/{id}/waitlist:
    post:
      tags: [admin-enrollments]
      summary: Waitlist with an optional reason (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '200': { description: WAITLISTED } }
  /admin/enrollments/auto-approval:
    get:
      tags: [admin-enrollments]
      summary: 'Automatic approval rules (Admin, BRQ-3.3): enabled, minCgpa (0 = none), manualIfPrerequisites'
      responses:
        '200': { description: The rules }
    put:
      tags: [admin-enrollments]
      summary: 'Change the automatic approval rules (Admin); each changed setting is audited'
      description: When enabled, an application that passes every rule is approved as soon as the student submits (or edits) it, audited with by AUTO_APPROVAL, and the student is notified. Applications that fail a rule stay PENDING; the admin list shows why (needsReview).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, minCgpa, manualIfPrerequisites]
              properties:
                enabled: { type: boolean }
                minCgpa: { type: number, minimum: 0, maximum: 10 }
                manualIfPrerequisites: { type: boolean }
      responses:
        '200': { description: The saved rules }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/enrollments/auto-approve:
    post:
      tags: [admin-enrollments]
      summary: 'Apply the saved rules to every application of a cycle still pending (Admin); one set-based update, audited, students notified'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycleId]
              properties:
                cycleId: { type: string, format: uuid }
      responses:
        '200': { description: 'approved and stillPending counts' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/enrollments/bulk:
    post:
      tags: [admin-enrollments]
      summary: Approve, reject or waitlist up to 200 applications in one transaction (Admin)
      description: >-
        All-or-nothing; one unknown id (404), invalid transition (409) or, when approving, a
        student accepted for an overlapping training (409 OVERLAPPING_TRAINING, details list each
        roll number and the other cycle) rolls back the batch.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids:
                  { type: array, minItems: 1, maxItems: 200, items: { type: string, format: uuid } }
                action: { type: string, enum: [APPROVE, REJECT, WAITLIST] }
                reason: { type: string, description: Required for REJECT }
      responses:
        '200': { description: '{ action, count, data }' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /notifications/me:
    get:
      tags: [notifications]
      summary: My in-app notifications and unread count
      parameters:
        - { name: unreadOnly, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
      responses: { '200': { description: '{ data, unreadCount }' } }
  /notifications/me/read-all:
    post:
      tags: [notifications]
      summary: Mark all my notifications read
      responses: { '200': { description: '{ updated }' } }
  /notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Mark one of my notifications read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        { '204': { description: Read }, '404': { $ref: '#/components/responses/NotFound' } }

  # ─── Sprint 4: batches, allocation, trainers, sessions ─────────────────────────
  /batches/mine:
    get:
      tags: [batches]
      summary: My batches (student - the batch I am in; trainer - assigned batches, BR-05)
      responses: { '200': { description: Batch summaries with trainers and next session } }
  /batches/{batchId}:
    get:
      tags: [batches]
      summary: Batch detail (admin any; trainer own; student own - roster hidden, NFR-08)
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Batch with roster (null for students) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /batches/{batchId}/sessions:
    get:
      tags: [batches]
      summary: Sessions of a batch, oldest first
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Session' } }

  /admin/trainers:
    get:
      tags: [admin-batches]
      summary: Active trainers for assignment (Admin)
      responses: { '200': { description: Trainers } }
  /admin/batches:
    get:
      tags: [admin-batches]
      summary: Batches (Admin, BRQ-4.1)
      parameters:
        - { name: cycleId, in: query, schema: { type: string, format: uuid } }
        - { name: courseId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [PLANNED, ACTIVE, CLOSED] } }
      responses: { '200': { description: Batch summaries } }
    post:
      tags: [admin-batches]
      summary: Create a batch (Admin)
      description: 422 BATCH_OUTSIDE_CYCLE unless both dates fall within the cycle (L5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId, cycleId, name, capacity, startDate, endDate, venue]
              properties:
                courseId: { type: string, format: uuid }
                cycleId: { type: string, format: uuid }
                name: { type: string }
                capacity: { type: integer, minimum: 1 }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                venue: { type: string }
      responses:
        '201': { description: Created (PLANNED) }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/batches/{batchId}:
    patch:
      tags: [admin-batches]
      summary: Update name, capacity (never below enrolled), dates or venue (Admin)
      description: 422 BATCH_OUTSIDE_CYCLE when new dates leave the cycle (L5).
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        { '200': { description: Updated }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/batches/{batchId}/activate:
    post:
      tags: [admin-batches]
      summary: PLANNED → ACTIVE (needs a trainer); students' applications ALLOCATED → ACTIVE
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        { '200': { description: Active }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/batches/{batchId}/close:
    post:
      tags: [admin-batches]
      summary: ACTIVE → CLOSED after the end date, once every student has a completion decision
      description: >-
        409 INVALID_BATCH_STATUS (not active), BATCH_NOT_ENDED (end date not passed) or
        STUDENTS_UNDECIDED (details list each student still in training).
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        { '200': { description: Closed }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/batches/{batchId}/candidates:
    get:
      tags: [admin-batches]
      summary: APPROVED or WAITLISTED applicants in the cycle who chose this course
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Candidates } }
  /admin/batches/{batchId}/students:
    post:
      tags: [admin-batches]
      summary: Place an approved or waitlisted applicant (capacity checked, BR-03)
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [enrollmentId],
                properties: { enrollmentId: { type: string, format: uuid } },
              }
      responses:
        '200': { description: Batch detail }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/batches/{batchId}/students/{enrollmentId}:
    delete:
      tags: [admin-batches]
      summary: Remove a student from a planned batch (application back to APPROVED)
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        { '200': { description: Batch detail }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/batches/{batchId}/students/{enrollmentId}/move:
    post:
      tags: [admin-batches]
      summary: Move a student to another batch (same cycle, a chosen course, capacity checked)
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [toBatchId],
                properties: { toBatchId: { type: string, format: uuid } },
              }
      responses:
        {
          '200': { description: Target batch detail },
          '409': { $ref: '#/components/responses/Conflict' },
        }
  /admin/batches/{batchId}/students/{enrollmentId}/withdraw:
    post:
      tags: [admin-batches]
      summary: Withdraw a student from a planned or running batch (application → WITHDRAWN)
      description: >-
        From a planned batch the seat is freed and the student leaves the roster. From an active
        batch the student stays on the roster with status WITHDRAWN (attendance and marks kept)
        but no longer holds a seat and is left off attendance sheets, mark entry and risk checks.
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [reason],
                properties: { reason: { type: string, minLength: 3, maxLength: 500 } },
              }
      responses:
        { '200': { description: Batch detail }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/batches/{batchId}/trainers:
    post:
      tags: [admin-batches]
      summary: Assign a trainer (BRQ-4.3)
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [trainerId],
                properties: { trainerId: { type: string, format: uuid } },
              }
      responses: { '200': { description: Batch detail } }
  /admin/batches/{batchId}/trainers/{trainerId}:
    delete:
      tags: [admin-batches]
      summary: Unassign a trainer (an active batch keeps at least one)
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: trainerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Batch detail } }
  /admin/batches/{batchId}/sessions:
    post:
      tags: [admin-batches]
      summary: Schedule one session or a weekly recurring plan (institution local time)
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [kind, startsAt, endsAt]
                  properties:
                    kind: { type: string, enum: [single] }
                    startsAt: { type: string, format: date-time }
                    endsAt: { type: string, format: date-time }
                    venue: { type: string }
                    topic: { type: string }
                    trainerId: { type: string, format: uuid }
                - type: object
                  required: [kind, daysOfWeek, startTime, endTime, from, until]
                  properties:
                    kind: { type: string, enum: [recurring] }
                    daysOfWeek:
                      {
                        type: array,
                        items: { type: string, enum: [SUN, MON, TUE, WED, THU, FRI, SAT] },
                      }
                    startTime: { type: string, example: '10:00' }
                    endTime: { type: string, example: '12:00' }
                    from: { type: string, format: date }
                    until: { type: string, format: date }
                    venue: { type: string }
                    topic: { type: string }
                    trainerId: { type: string, format: uuid }
      responses:
        '201':
          description: Created sessions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Session' } }
        '409':
          description: "SCHEDULE_CLASH (BR-20): the venue, or a trainer certainly teaching both sessions (named on the session, or the batch's only trainer), is already booked at an overlapping time; details list each clash. Nothing is saved."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/batches/{batchId}/sessions/{sessionId}:
    patch:
      tags: [admin-batches]
      summary: Cancel a scheduled session
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [status],
                properties: { status: { type: string, enum: [CANCELLED] } },
              }
      responses: { '200': { description: Cancelled } }

  /admin/allocations/preview:
    post:
      tags: [admin-batches]
      summary: Run the allocation engine without changing anything (BRQ-4.2)
      description: |
        Rank first, then the priority rule (setting allocation.priorityRule); never above capacity
        (BR-03); overflow waitlisted. Stored for allocation.previewTtlMinutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [cycleId],
                properties: { cycleId: { type: string, format: uuid } },
              }
      responses:
        '200': { description: 'previewId, assignments, waitlist, per-batch fill, stats, warnings' }
  /admin/allocations/confirm:
    post:
      tags: [admin-batches]
      summary: Apply a preview in one transaction
      description: 409 PREVIEW_STALE if applications or batches changed since the preview; PREVIEW_EXPIRED; PREVIEW_ALREADY_CONFIRMED.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [previewId],
                properties: { previewId: { type: string, format: uuid } },
              }
      responses:
        '200': { description: '{ previewId, allocated, waitlisted }' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─── Sprint 5: attendance, assessments, progress, evaluations ─────────────────
  /sessions/mine:
    get:
      tags: [attendance]
      summary: My sessions as a trainer (default 14 days back to 30 ahead)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses: { '200': { description: 'Sessions with batch, roster size and marked count' } }
  /sessions/{sessionId}/attendance:
    get:
      tags: [attendance]
      summary: Attendance sheet (trainer of the batch or admin)
      description: >-
        Includes canEdit, requiresReason (admin after the window), editableUntil and lockedReason.
        The trainer window is 48 h from the first marking or from the session's end, whichever
        comes first (BR-06, L3), so an unmarked session closes too.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Sheet }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [attendance]
      summary: Mark the whole roster (BRQ-5.1, BR-05, BR-06)
      description: |
        Session must have started, not be cancelled, batch ACTIVE. Trainers may edit within
        attendance.editWindowHours of the first marking (409 EDIT_WINDOW_CLOSED after). Admins may
        edit after the window with a reason (422 REASON_REQUIRED without). Every mark and change is
        audited. First save sets the session CONDUCTED.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required: [studentId, status]
                    properties:
                      studentId: { type: string, format: uuid }
                      status: { type: string, enum: [PRESENT, ABSENT, LATE] }
                reason: { type: string, minLength: 3 }
      responses:
        '200': { description: Updated sheet }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /batches/{batchId}/attendance-summary:
    get:
      tags: [attendance]
      summary: Per-student attendance % (two decimals), absences, consecutive absences, sessions ended but never marked (BRQ-5.3, L2); students who withdrew are left out
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Rows } }
  /students/{studentId}/attendance:
    get:
      tags: [attendance]
      summary: A student's attendance per batch ("me" for the signed-in student)
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
      responses:
        {
          '200': { description: Figures and own session history },
          '403': { $ref: '#/components/responses/Forbidden' },
        }
  /students/{studentId}/training:
    get:
      tags: [assessments]
      summary: 'My training: attendance, results, weighted aggregate and projected grade (live)'
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
      responses:
        {
          '200': { description: One entry per batch },
          '403': { $ref: '#/components/responses/Forbidden' },
        }

  /batches/{batchId}/assessments:
    get:
      tags: [assessments]
      summary: Assessments of a batch (trainer of the batch or admin)
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Assessments with recorded count } }
    post:
      tags: [assessments]
      summary: Create an assessment (BRQ-6.1)
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, mode, maxMarks, weightage, isMandatory]
              properties:
                title: { type: string }
                mode: { type: string, enum: [THEORY, PRACTICAL] }
                maxMarks: { type: number, exclusiveMinimum: true, minimum: 0 }
                weightage: { type: number, exclusiveMinimum: true, minimum: 0 }
                isMandatory: { type: boolean }
                heldOn:
                  type: string
                  format: date
                  nullable: true
                  description: Must fall within the batch's dates (422 HELD_OUTSIDE_BATCH).
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /assessments/{assessmentId}:
    patch:
      tags: [assessments]
      summary: Edit (max marks never below a recorded result → 409 MAX_BELOW_RESULTS)
      parameters:
        - { name: assessmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Updated } }
    delete:
      tags: [assessments]
      summary: Delete an assessment without results (409 HAS_RESULTS otherwise)
      parameters:
        - { name: assessmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '204': { description: Deleted } }
  /assessments/{assessmentId}/results:
    get:
      tags: [assessments]
      summary: Marks sheet for the roster
      parameters:
        - { name: assessmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Sheet } }
    put:
      tags: [assessments]
      summary: Record or correct marks for any subset of the roster (BR-07)
      description: All values must be 0..maxMarks, else 422 MARKS_OUT_OF_RANGE with per-student details and nothing saved. Changes audited old → new.
      parameters:
        - { name: assessmentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  items:
                    type: object
                    required: [studentId, marks]
                    properties:
                      studentId: { type: string, format: uuid }
                      marks: { type: number }
                      remarks: { type: string, nullable: true }
      responses:
        '200': { description: Updated sheet }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /batches/{batchId}/progress:
    get:
      tags: [assessments]
      summary: Progress milestones, newest first
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Milestones } }
    post:
      tags: [assessments]
      summary: Record a milestone for the batch or one student (BRQ-6.3)
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [milestone]
              properties:
                studentId: { type: string, format: uuid, nullable: true }
                milestone: { type: string }
                note: { type: string, nullable: true }
      responses: { '201': { description: Created } }
  /batches/{batchId}/evaluations:
    get:
      tags: [assessments]
      summary: Roster with each student's final evaluation (if any)
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Rows } }
  /enrollments/{enrollmentId}/evaluation:
    get:
      tags: [assessments]
      summary: A student's final evaluation
      parameters:
        - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Evaluation or null } }
    put:
      tags: [assessments]
      summary: Record the final evaluation and completion recommendation (trainer of the batch or admin)
      parameters:
        - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [remarks, recommended]
              properties:
                remarks: { type: string, minLength: 3 }
                recommended: { type: boolean }
      responses:
        '200': { description: Saved }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /completions/queue:
    get:
      tags: [completion]
      summary: Completion queue with the system's eligibility result (BRQ-9.4)
      description: Every student of the batch who is in training or has finished, with the four BR-09 checks (passed, actual, required), live figures, projected grade and any certificate. Admin only.
      parameters:
        - { name: batchId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Queue rows
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CompletionRow' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /completions/{enrollmentId}/approve:
    post:
      tags: [completion]
      summary: Approve completion and issue the certificate (BR-09, BR-10, TAD §8.1)
      description: Recomputes eligibility; if any check fails → 409 NOT_ELIGIBLE with the failing checks as details and nothing saved. Otherwise one transaction sets the enrollment COMPLETED and creates the certificate (random 16-character public code, grade/aggregate/attendance snapshots), both audited. The PDF is then rendered and stored and the enrollment becomes CERTIFIED; if rendering fails it stays COMPLETED and the response has rendered=false (retry with POST /certificates/{id}/render). 409 ALREADY_COMPLETED or NOT_IN_TRAINING for the wrong status.
      parameters:
        - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApproveResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /completions/{enrollmentId}/not-completed:
    post:
      tags: [completion]
      summary: Close a student in training as NOT_COMPLETED with a reason
      parameters:
        - { name: enrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: Recorded }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /certificates:
    get:
      tags: [certificates]
      summary: Register of every certificate issued (BRQ-7.3), newest first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - {
            name: q,
            in: query,
            schema: { type: string },
            description: 'Student name, roll number or certificate code',
          }
        - { name: status, in: query, schema: { type: string, enum: [VALID, REVOKED, SUPERSEDED] } }
      responses:
        '200':
          description: Page of certificates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Certificate' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /certificates/{certificateId}:
    get:
      tags: [certificates]
      summary: One certificate (its own student or an admin)
      parameters:
        - { name: certificateId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Certificate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /certificates/{certificateId}/download:
    get:
      tags: [certificates]
      summary: Download the certificate PDF (its own student or an admin; TC-17)
      parameters:
        - { name: certificateId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /certificates/{certificateId}/render:
    post:
      tags: [certificates]
      summary: Retry rendering after a failure (UC-04 4a); safe to repeat
      parameters:
        - { name: certificateId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Rendered and certified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApproveResult' }
        '409': { $ref: '#/components/responses/Conflict' }
  /students/{studentId}/certificates:
    get:
      tags: [certificates]
      summary: A student's certificates ("me" for the signed-in student)
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Certificates, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Certificate' } }
  /reports/students/{studentId}.pdf:
    get:
      tags: [reports]
      summary: Student performance report PDF (BRQ-8.1)
      description: Attendance, results, aggregate, grade (the certificate snapshot once certified, otherwise projected), trainer evaluation and milestones. The student ("me") or an admin only; trainers get 403. Each download stores a PerformanceReport snapshot and an audit row. 404 when the student has no training yet.
      parameters:
        - {
            name: studentId,
            in: path,
            required: true,
            schema: { type: string },
            description: Student id or "me",
          }
        - {
            name: enrollmentId,
            in: query,
            schema: { type: string, format: uuid },
            description: Which training; defaults to the latest,
          }
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reports/batches/{batchId}:
    get:
      tags: [reports]
      summary: Batch report as CSV or PDF (BRQ-8.2)
      description: Per student attendance, marks per assessment (CSV), aggregate, grade, completion status and certificate ID. The batch's trainers and admins.
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: format, in: query, schema: { type: string, enum: [csv, pdf], default: csv } }
      responses:
        '200':
          description: Report file
          content:
            text/csv:
              schema: { type: string }
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /reports/courses/{courseId}:
    get:
      tags: [reports]
      summary: Course report as CSV or PDF (BRQ-8.2), admin only
      description: Per batch students, in training, completed, not completed, completion rate (completed ÷ finished) and grade distribution of valid certificates, plus a total row.
      parameters:
        - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: format, in: query, schema: { type: string, enum: [csv, pdf], default: csv } }
      responses:
        '200':
          description: Report file
          content:
            text/csv:
              schema: { type: string }
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /dashboard/admin:
    get:
      tags: [dashboard]
      summary: Admin figures (BRQ-9.1, BRQ-9.2), aggregated in SQL
      description: >-
        endedBatches (L8) lists active batches past their end date with the number of students
        still waiting for a completion decision (0 = ready to close).
      parameters:
        - {
            name: cycleId,
            in: query,
            schema: { type: string, format: uuid },
            description: Enrollment funnel for one cycle (default all),
          }
      responses:
        '200':
          description: Counts, enrollment funnel, completion, grades, weekly attendance trend
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboard' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /dashboard/trainer:
    get:
      tags: [dashboard]
      summary: Trainer figures (BRQ-9.3)
      description: Active batches and students, today's sessions, sessions still needing attendance, students below the attendance minimum.
      responses:
        '200': { description: Trainer dashboard }
        '403': { $ref: '#/components/responses/Forbidden' }
  /dashboard/student:
    get:
      tags: [dashboard]
      summary: Student figures (BRQ-9.3)
      description: Latest application, live attendance/aggregate/projected grade, next session and certificate.
      responses:
        '200': { description: Student dashboard }
        '403': { $ref: '#/components/responses/Forbidden' }
  /courses/{courseId}/competencies:
    get:
      tags: [competency]
      summary: Competencies of a course (staff) (BRQ-C.1)
      parameters:
        - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Competencies by code
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Competency' } }
    post:
      tags: [competency]
      summary: Define a competency (Admin)
      description: Code unique per course (409 COMPETENCY_CODE_TAKEN), required level 1–4, mandatory flag, and linked assessments from this course's batches (422 ASSESSMENT_NOT_IN_COURSE otherwise). Audited.
      parameters:
        - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompetencyInput' }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /courses/{courseId}/linkable-assessments:
    get:
      tags: [competency]
      summary: Assessments in any batch of the course, for linking (Admin)
      parameters:
        - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Assessments with their batch } }
  /courses/{courseId}/resources:
    get:
      tags: [competency]
      summary: Learning resources of a course, approved and pending (staff)
      parameters:
        - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Resources } }
  /competencies/{id}:
    put:
      tags: [competency]
      summary: Edit a competency and replace its linked assessments (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompetencyInput' }
      responses:
        '200': { description: Updated }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [competency]
      summary: Delete a competency nobody has been rated on (409 HAS_RATINGS)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Conflict' }
  /resources:
    post:
      tags: [competency]
      summary: Add a learning resource (trainer or Admin; an admin's is approved at once)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceInput' }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /resources/{id}:
    put:
      tags: [competency]
      summary: Edit a resource (its creator or an admin; a trainer's edit needs approval again)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceInput' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [competency]
      summary: Delete a resource (its creator or an admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /resources/{id}/approve:
    post:
      tags: [competency]
      summary: Approve a resource so it is recommended to students (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Approved } }
  /batches/{batchId}/competency-ratings:
    get:
      tags: [competency]
      summary: Rating grid — students × competencies (the batch's trainers, Admin)
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Grid } }
    put:
      tags: [competency]
      summary: Rate students 1–4 in bulk; optionally verify (assigned trainer only) (BRQ-C.2, BR-13)
      description: One transaction. verify=true only at or above the required level (422 BELOW_REQUIRED_LEVEL, every offending cell in details, nothing saved). A verified rating can be raised but never set below the required level (409 VERIFIED_LOCKED). Unchanged cells are skipped; changes audited (COMPETENCY_RATED / _RATING_UPDATED / _VERIFIED). Batch must be ACTIVE.
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ratings]
              properties:
                ratings:
                  type: array
                  items:
                    type: object
                    required: [studentId, competencyId, level]
                    properties:
                      studentId: { type: string, format: uuid }
                      competencyId: { type: string, format: uuid }
                      level: { type: integer, minimum: 1, maximum: 4 }
                      verify: { type: boolean }
      responses:
        '200': { description: Updated grid }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /batches/{batchId}/competency-heatmap:
    get:
      tags: [competency]
      summary: Batch heatmap — level, source, gap and a below-level flag per cell (BRQ-12.4)
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Heatmap }
        '403': { $ref: '#/components/responses/Forbidden' }
  /students/{studentId}/gaps:
    get:
      tags: [competency]
      summary: A student's competency gaps (BRQ-12.1–12.3, BR-18)
      description: Demonstrated level = latest trainer rating, else provisional from linked assessment % (setting competency.provisionalBands), else not assessed. Gap = max(0, required − demonstrated). Returns belowLevel and notAssessed ranked by gap (mandatory first on ties) with approved resources only, and met. "me" for the signed-in student.
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
        - {
            name: batchId,
            in: query,
            schema: { type: string, format: uuid },
            description: Default the latest batch,
          }
      responses:
        '200': { description: Gaps }
        '403': { $ref: '#/components/responses/Forbidden' }
  /public/verify/{code}:
    get:
      tags: [public]
      summary: Verify a certificate by its ID — no login (BRQ-15.2, 15.3, TAD §8.3)
      description: Returns only name, course, grade, issue date and status (VALID, REVOKED with the date but never the reason, or SUPERSEDED). Unknown or malformed codes → 404 CERTIFICATE_NOT_FOUND "Certificate not found". Each lookup of a known code is counted in the background. Cache-Control no-cache with an ETag, so a revocation shows at once. Rate-limited per IP (setting public.rateLimitPerMin, 30/min) → 429.
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicVerification' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /public/passport/{token}:
    get:
      tags: [public]
      summary: A shared Skill Passport, read-only — no login (BRQ-10.3, BR-15)
      description: Name, optional photo, verified competencies (title, level, course, date) and valid certificates only — never marks, attendance or contact details. Revoked or expired link → 410 LINK_INACTIVE "Link no longer active"; unknown → 404.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Public passport }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Link no longer active }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /students/{studentId}/passport:
    get:
      tags: [passport]
      summary: Skill Passport — verified competencies across all cycles, practical and theory, certificates (BRQ-10.1, 10.2, 10.4)
      description: The student ("me"), their trainers and admins. Revoked verifications are listed separately with their reason.
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Passport }
        '403': { $ref: '#/components/responses/Forbidden' }
  /students/{studentId}/passport.pdf:
    get:
      tags: [passport]
      summary: Skill Passport as PDF
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
  /students/me/passport/shares:
    get:
      tags: [passport]
      summary: My share links with status and view counts (Student)
      responses: { '200': { description: Share links } }
    post:
      tags: [passport]
      summary: Create a share link (Student) — the token is returned once and stored hashed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInDays:
                  {
                    type: integer,
                    minimum: 1,
                    description: 'Default setting passport.shareDefaultDays (30), at most passport.shareMaxDays (365)',
                  }
      responses:
        '201': { description: Link with token and url }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /passport/shares/{id}:
    delete:
      tags: [passport]
      summary: Revoke one of my share links (Student)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
  /competency-ratings/{id}/revoke:
    post:
      tags: [passport]
      summary: Revoke a verified competency with a reason (Admin, BR-14) — kept on record, audited
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [reason],
                properties: { reason: { type: string, minLength: 3 } },
              }
      responses:
        '200': { description: Revoked }
        '409': { $ref: '#/components/responses/Conflict' }
  /certificates/{certificateId}/revoke:
    post:
      tags: [certificates]
      summary: Revoke a valid certificate with a reason (Admin, BRQ-15.4)
      parameters:
        - { name: certificateId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [reason],
                properties: { reason: { type: string, minLength: 3 } },
              }
      responses:
        '200':
          description: Revoked certificate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '409': { $ref: '#/components/responses/Conflict' }
  /certificates/{certificateId}/reissue:
    post:
      tags: [certificates]
      summary: Reissue with a new random code (Admin, BR-19)
      description: >-
        Works on a VALID certificate (it becomes SUPERSEDED) or on a REVOKED one that has not been
        replaced yet (it stays REVOKED). The old certificate links to the new one. Anything else
        is refused with 409 CERTIFICATE_NOT_REISSUABLE.
      parameters:
        - { name: certificateId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: The new certificate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '409': { $ref: '#/components/responses/Conflict' }
  /risk-flags:
    get:
      tags: [intervention]
      summary: At-risk students with reasons (BRQ-11.2) - trainers see their own batches, admins all
      description: Worst level first, then the longest-open. status defaults to OPEN. A trainer filtering on someone else's batch gets 403.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: batchId, in: query, schema: { type: string, format: uuid } }
        - { name: level, in: query, schema: { type: string, enum: [LOW, MEDIUM, HIGH] } }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [OPEN, CLOSED, ALL], default: OPEN },
          }
        - { name: escalated, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Page of flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/RiskFlagRow' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /risk-flags/evaluate:
    post:
      tags: [intervention]
      summary: Run the daily risk evaluation now (Admin) - the same job the cron runs
      responses:
        '200': { description: Run summary; skipped is true when a run is already in progress }
  /risk-flags/{flagId}:
    get:
      tags: [intervention]
      summary: One flag with its actions, a timeline built from the audit log, and who can own an action (BRQ-11.4)
      parameters:
        - { name: flagId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Flag detail }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /risk-flags/{flagId}/actions:
    post:
      tags: [intervention]
      summary: Record a remedial action with owner and due date (BRQ-11.3)
      description: The owner must be one of the batch's trainers or an admin (422 INVALID_OWNER); dueOn today or later (422 DUE_IN_PAST); the flag must be open (409 FLAG_CLOSED). The student is notified of the agreed action, never the note. Audited.
      parameters:
        - { name: flagId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, ownerId, dueOn]
              properties:
                type: { type: string, enum: [COUNSELLING, EXTRA_SESSION, PRACTICE_TASK] }
                ownerId: { type: string, format: uuid }
                dueOn: { type: string, format: date }
                note: { type: string, maxLength: 1000 }
      responses:
        '201': { description: The updated flag detail }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /risk-actions/{actionId}:
    patch:
      tags: [intervention]
      summary: Record an action's outcome (completedAt defaults to now and cannot be in the future)
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, minLength: 3, maxLength: 1000 }
                completedAt: { type: string, format: date-time }
      responses:
        '200': { description: The updated flag detail }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /students/me/risk:
    get:
      tags: [intervention]
      summary: The student's own open flags with reasons and agreed actions - supportive view (BRQ-11.5)
      responses:
        '200': { description: Own flags (staff notes are never included) }
  /internal/jobs/risk-evaluation:
    get:
      tags: [jobs]
      summary: Daily risk evaluation, called by Vercel Cron (BRQ-11.1, TAD 8.2)
      description: Authorization Bearer CRON_SECRET (not a user token). Evaluates the students still in training in every ACTIVE batch and closes flags of students who finished; a job lease means two runs never overlap (a second returns skipped true). If the 25 s budget runs out it returns partial with remainingIds, and the next run starts with those (catch-up); missedRuns counts days without a successful run. POST works the same for manual runs.
      security: []
      responses:
        '200': { description: Run summary }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [jobs]
      summary: Same as GET, for manual runs with the cron secret
      security: []
      responses:
        '200': { description: Run summary }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/jobs/analytics-refresh:
    get:
      tags: [jobs]
      summary: Nightly refresh of the outcome analytics views, called by Vercel Cron (F20)
      description: Authorization Bearer CRON_SECRET. Refreshes analytics_batch_outcomes and analytics_course_competency CONCURRENTLY under a job lease (a second run returns refreshed false); missedRuns counts nights without a successful refresh (one refresh catches up all of them). POST works the same.
      security: []
      responses:
        '200': { description: refreshed and refreshedAt }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [jobs]
      summary: Same as GET, for manual runs with the cron secret
      security: []
      responses:
        '200': { description: refreshed and refreshedAt }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /audit-logs:
    get:
      tags: [audit]
      summary: Audit log viewer (Admin, BRQ-19.2) - newest first, read-only
      description: There are no edit or delete endpoints, and the table refuses UPDATE and DELETE (BRQ-19.3). from and to are inclusive UTC days.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Page of audit rows (user is null for system jobs) }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit-logs/facets:
    get:
      tags: [audit]
      summary: Entities and actions present in the log, for the filters (Admin)
      responses:
        '200': { description: Entities and actions }
  /audit-logs/export.csv:
    get:
      tags: [audit]
      summary: The same filters as CSV (Admin), at most 10000 rows; X-Export-Truncated says whether more matched
      responses:
        '200':
          description: CSV file
          content:
            text/csv: {}
  /scheduling/check:
    post:
      tags: [scheduling]
      summary: Smart scheduling advisor (Admin, F14) - capacity, clashes and suggestions; read-only
      description: For each batch, capacity after adding students (NEAR at or above scheduling.capacityWarnPercent, OVER above 100 %), venue and trainer clashes of its proposed and upcoming sessions (BR-20, startA < endB && startB < endA; hard = same venue or the same trainer named on both sessions, soft = a trainer who only teaches through batch assignment), nearby free slots for clashing proposed sessions, and free trainers when none is assigned or a trainer clashes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batches]
              properties:
                batches:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [batchId]
                    properties:
                      batchId: { type: string, format: uuid }
                      addStudents: { type: integer, minimum: 0, default: 0 }
                      sessions:
                        type: array
                        maxItems: 200
                        items:
                          type: object
                          required: [startsAt, endsAt]
                          properties:
                            startsAt: { type: string, format: date-time }
                            endsAt: { type: string, format: date-time }
                            venue: { type: string }
                            trainerId: { type: string, format: uuid }
      responses:
        '200': { description: 'Advice per batch: capacity, clashes, trainers and suggestions' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /files/{token}:
    get:
      tags: [evidence]
      summary: Local storage driver only - download through a signed link
      description: The token is an HMAC-signed grant (key, operation, expiry); no session. Expired, tampered or upload grants get 403. With the Vercel Blob driver this route is 404 and links point at the store.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The file }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [evidence]
      summary: Local storage driver only - upload through a signed link
      description: The body is the file. Content-Type must equal the grant's type and the size must be within its limit (422); a link works once (409).
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Stored }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /evidence/upload-url:
    post:
      tags: [evidence]
      summary: Get a one-file upload target for practical evidence (trainer of the batch, admin; F18)
      description: Type must be in evidence.allowedMime (images and PDF; videos are links only) and size at most evidence.maxBytes (10 MB), else 422 UNSUPPORTED_TYPE / FILE_TOO_LARGE. Production returns a Vercel Blob client token scoped to one server-chosen key, type and size; development returns a signed local URL. The browser uploads directly; the file never passes through the API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resultId, fileName, contentType, sizeBytes]
              properties:
                resultId: { type: string, format: uuid }
                fileName: { type: string }
                contentType: { type: string }
                sizeBytes: { type: integer }
      responses:
        '200': { description: 'Upload target: { driver, key, clientToken | url, expiresAt }' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /evidence/{evidenceId}/url:
    get:
      tags: [evidence]
      summary: A short-lived signed link to open evidence (staff of the batch, admin, or the student it belongs to)
      parameters:
        - { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: '{ url, expiresAt } (evidence.downloadTtlSeconds)' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /results/{resultId}/evidence:
    post:
      tags: [evidence]
      summary: Attach an uploaded file or a video link, the competency it proves and rubric scores (BRQ-18.1-18.3)
      description: FILE keys must be under this result's prefix (422 INVALID_KEY) and exist in the store with an allowed type and size (422 UPLOAD_NOT_FOUND); a file attaches once (409). LINK must be https. Scores must use the rubric's criteria and levels (422 INVALID_SCORES / NO_RUBRIC). Audited.
      parameters:
        - { name: resultId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: The evidence }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /assessments/{assessmentId}/rubric:
    get:
      tags: [evidence]
      summary: The rubric of a practical assessment (null when none)
      parameters:
        - { name: assessmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Rubric or null }
    put:
      tags: [evidence]
      summary: Create or replace the rubric - named criteria and ascending levels (BRQ-18.2)
      parameters:
        - { name: assessmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The rubric }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /assessments/{assessmentId}/evidence:
    get:
      tags: [evidence]
      summary: The assessment's recorded results with their evidence, rubric and the course's practical competencies
      parameters:
        - { name: assessmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Evidence sheet }
  /job-roles:
    get:
      tags: [opportunities]
      summary: Job roles with their required competency codes and levels (Admin, BRQ-C.3)
      responses:
        '200': { description: Job roles }
    post:
      tags: [opportunities]
      summary: Create a job role (codes are stored upper-case; title unique, 409 ROLE_TITLE_TAKEN)
      responses:
        '201': { description: The role }
        '409': { $ref: '#/components/responses/Conflict' }
  /job-roles/{id}:
    put:
      tags: [opportunities]
      summary: Replace a job role's title, description, status and requirements
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The role }
  /opportunities:
    get:
      tags: [opportunities]
      summary: Opportunities (Admin), soonest closing first
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [OPEN, CLOSED, ALL], default: ALL },
          }
      responses:
        '200': { description: Page of opportunities }
    post:
      tags: [opportunities]
      summary: Publish an internship, apprenticeship or job for a role (BRQ-13.1)
      responses:
        '201': { description: The opportunity }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /opportunities/{id}:
    put:
      tags: [opportunities]
      summary: Edit an opportunity
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The opportunity }
  /opportunities/{id}/interested:
    get:
      tags: [opportunities]
      summary: Interested students with their current match %, best match first (Admin, BRQ-13.4)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Interested students }
  /opportunities/{id}/interested.csv:
    get:
      tags: [opportunities]
      summary: The same list as CSV (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: CSV file
          content:
            text/csv: {}
  /opportunities/{id}/interest:
    post:
      tags: [opportunities]
      summary: Mark interest (Student, idempotent); 409 OPPORTUNITY_CLOSED once closed
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: '{ interested: true }' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [opportunities]
      summary: Withdraw interest (Student)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: '{ interested: false }' }
  /students/me/matches:
    get:
      tags: [opportunities]
      summary: Open opportunities ranked by match % = verified required / total required x 100 (BR-22), with missing skills and resources (BRQ-13.2, 13.3)
      responses:
        '200': { description: Ranked matches }
  /analytics/outcomes:
    get:
      tags: [analytics]
      summary: Outcome analytics (Admin, F20) - completion, certification, attendance, average score, verified competencies and placement rates by course and batch
      description: >-
        Counts come from materialized views refreshed nightly (refreshedAt); rates are computed
        on read and null when there is nothing to divide by. certificatesSinceRefresh counts
        certificates issued after that refresh (not in these figures yet).
      parameters:
        - { name: cycleId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'Totals, courses and batches' }
  /analytics/outcomes.csv:
    get:
      tags: [analytics]
      summary: The same figures as CSV, one row per batch (Admin)
      parameters:
        - { name: cycleId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: CSV file
          content:
            text/csv: { schema: { type: string } }
  /analytics/refresh:
    post:
      tags: [analytics]
      summary: Refresh the analytics views now (Admin; the cron does this nightly)
      responses:
        '200': { description: refreshed and refreshedAt }
  /analytics/placements:
    get:
      tags: [analytics]
      summary: Recorded placements, newest first (Admin)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Page of placements }
    post:
      tags: [analytics]
      summary: Record a placement (job, apprenticeship, internship, self-employment or further study) for a student who finished a batch; audited
      responses:
        '201': { description: The placement }
        '422':
          description: NOT_FINISHED (the student has no completed batch), OPPORTUNITY_NOT_FOUND, or validation errors
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /analytics/placements/candidates:
    get:
      tags: [analytics]
      summary: Finished batches of the student with this roll number, to pick from when recording a placement (Admin)
      parameters:
        - { name: rollNo, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Candidates }
  /analytics/placements/{id}:
    delete:
      tags: [analytics]
      summary: Remove a placement recorded by mistake (Admin); audited
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /assistant/status:
    get:
      tags: [assistant]
      summary: Whether the training assistant is on, the student's courses with approved materials, and questions left today (Student, F17)
      responses:
        '200': { description: Assistant status }
  /assistant/ask:
    post:
      tags: [assistant]
      summary: Ask the training assistant (Student, F17, BR-21)
      description: Checks the switch, the per-student daily limit (assistant.dailyLimitPerUser) and the monthly cap in US dollars (AI_MONTHLY_CAP), then searches approved materials of the student's own courses. Below assistant.minSimilarity it declines (refused NOT_IN_MATERIALS) without calling the model. The model receives only the excerpts, the question and the reply language, never the student's personal data (NFR-13). Practice mode returns multiple-choice questions validated on the server. Every request is logged with excerpts, tokens, cost and latency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 3, maxLength: 1000 }
                mode: { type: string, enum: [answer, practice, simplify], default: answer }
      responses:
        '200':
          {
            description: 'Answer or practice questions with numbered sources, or refused: NOT_IN_MATERIALS, NO_COURSE or OFF_TOPIC; plus resources for open skill gaps and questions left today',
          }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429':
          description: ASSISTANT_DAILY_LIMIT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: AI_DISABLED, ASSISTANT_BUDGET_REACHED or ASSISTANT_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /assistant/usage:
    get:
      tags: [assistant]
      summary: This month's questions, answers, refusals by reason, tokens, cost against the cap and average latency (Admin, BRQ-17.5)
      responses:
        '200': { description: Usage figures }
  /materials:
    get:
      tags: [assistant]
      summary: Course materials for the assistant, newest first (Admin, BRQ-17.2)
      parameters:
        - { name: courseId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Materials }
    post:
      tags: [assistant]
      summary: Record an uploaded material as PENDING (Admin); the file must exist under materials/<courseId>/; audited
      responses:
        '201': { description: The material }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /materials/upload-url:
    post:
      tags: [assistant]
      summary: A one-file upload target for a PDF, .txt or .md material (Admin; size limit assistant.materialMaxBytes)
      responses:
        '200': { description: Upload target }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /materials/{id}/approve:
    post:
      tags: [assistant]
      summary: Extract the text, split it into excerpts, embed them and make the material searchable (Admin); audited
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The approved material with its excerpt count }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: NO_TEXT (no text layer, e.g. a scan)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /materials/{id}/reject:
    post:
      tags: [assistant]
      summary: Reject a pending material (Admin); audited
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The rejected material }
        '409': { $ref: '#/components/responses/Conflict' }
  /materials/{id}:
    delete:
      tags: [assistant]
      summary: Delete a material and its excerpts (Admin); audited
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  schemas:
    RiskFlagRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        student:
          type: object
          properties: { id: { type: string }, fullName: { type: string }, rollNo: { type: string } }
        batch:
          type: object
          properties: { id: { type: string }, name: { type: string } }
        level: { type: string, enum: [LOW, MEDIUM, HIGH] }
        reasons:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              level: { type: string, enum: [MEDIUM, HIGH] }
              actual: { type: number }
              threshold: { type: number }
              competency: { type: string }
        status: { type: string, enum: [OPEN, CLOSED] }
        openedAt: { type: string, format: date-time }
        clearSince: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        escalatedAt: { type: string, format: date-time, nullable: true }
        actionCount: { type: integer }
        openActionCount: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]*$'
              example: ENROLLMENT_WINDOW_CLOSED
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path: { type: string }
                  message: { type: string }
    PageMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Health:
      type: object
      required: [status, db, version, time]
      properties:
        status: { type: string, enum: [ok, degraded] }
        db: { type: string, enum: [ok, error] }
        version: { type: string }
        time: { type: string, format: date-time }
    Role: { type: string, enum: [STUDENT, TRAINER, ADMIN] }
    Locale: { type: string, enum: [en, or, hi] }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    Me:
      type: object
      required: [id, email, fullName, role, locale, mustChangePassword, student, trainer]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        locale: { $ref: '#/components/schemas/Locale' }
        mustChangePassword:
          type: boolean
          description: An admin set the password; the user must choose their own first.
        student:
          nullable: true
          type: object
          properties:
            id: { type: string, format: uuid }
            rollNo: { type: string }
            cgpa: { type: string, example: '7.50' }
            phone: { type: string, nullable: true }
        trainer:
          nullable: true
          type: object
          properties:
            id: { type: string, format: uuid }
            employeeCode: { type: string }
            phone: { type: string, nullable: true }
            specialization: { type: string, nullable: true }
    AuthSession:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, example: 900 }
        user: { $ref: '#/components/schemas/Me' }
    UpdateProfileRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        locale: { $ref: '#/components/schemas/Locale' }
        phone: { type: string, nullable: true }
    CreateUserRequest:
      type: object
      required: [role, email, fullName, password]
      description: STUDENT also requires rollNo and cgpa; TRAINER requires employeeCode.
      properties:
        role: { $ref: '#/components/schemas/Role' }
        email: { type: string, format: email }
        fullName: { type: string }
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: At least one letter and one digit.
        locale: { $ref: '#/components/schemas/Locale' }
        mustChangePassword:
          type: boolean
          default: false
          description: Ask the user to choose their own password at first sign-in.
        rollNo: { type: string }
        cgpa: { type: number, minimum: 0, maximum: 10 }
        employeeCode: { type: string }
        specialization: { type: string }
        phone: { type: string }
    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        locale: { $ref: '#/components/schemas/Locale' }
        isActive: { type: boolean }
        lockedUntil: { type: string, format: date-time, nullable: true }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        rollNo: { type: string, nullable: true }
        employeeCode: { type: string, nullable: true }
    EnrollmentStatus:
      type: string
      enum:
        [
          PENDING,
          APPROVED,
          REJECTED,
          WAITLISTED,
          ALLOCATED,
          ACTIVE,
          COMPLETED,
          NOT_COMPLETED,
          CERTIFIED,
          WITHDRAWN,
        ]
    Cycle:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
    Offering:
      type: object
      properties:
        courseId: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        enrollmentOpensAt: { type: string, format: date-time }
        enrollmentClosesAt: { type: string, format: date-time }
        isOpen: { type: boolean }
        windowState: { type: string, enum: [NOT_OFFERED, UPCOMING, OPEN, CLOSED] }
    CatalogueCourse:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        description: { type: string }
        durationWeeks: { type: integer }
        prerequisites: { type: string, nullable: true }
        seatCapacity: { type: integer }
        seatsRemaining: { type: integer, description: Indicative }
        offering:
          { type: object, allOf: [{ $ref: '#/components/schemas/Offering' }], nullable: true }
    Enrollment:
      type: object
      properties:
        id: { type: string, format: uuid }
        cycleId: { type: string, format: uuid }
        cycleName: { type: string }
        status: { $ref: '#/components/schemas/EnrollmentStatus' }
        reason: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        editable: { type: boolean }
        preferences:
          type: array
          items:
            type: object
            properties:
              rank: { type: integer }
              courseId: { type: string, format: uuid }
              courseCode: { type: string }
              courseTitle: { type: string }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        venue: { type: string }
        topic: { type: string, nullable: true }
        status: { type: string, enum: [SCHEDULED, CONDUCTED, CANCELLED] }
        trainerId: { type: string, format: uuid, nullable: true }
        trainerName: { type: string, nullable: true }
    EligibilityCheck:
      type: object
      properties:
        rule:
          {
            type: string,
            enum: [ATTENDANCE, SESSIONS_RECORDED, MANDATORY_ASSESSMENTS, AGGREGATE, RECOMMENDATION],
          }
        passed: { type: boolean }
        actual: { anyOf: [{ type: number, nullable: true }, { type: boolean }] }
        required: { oneOf: [{ type: number }, { type: boolean }] }
        missing:
          type: array
          items: { type: string }
          description: MANDATORY_ASSESSMENTS only - titles of the ones still without marks.
    CertificateSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        publicCode: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{16}$' }
        status: { type: string, enum: [VALID, REVOKED, SUPERSEDED] }
        issuedAt: { type: string, format: date-time }
        rendered: { type: boolean }
    Certificate:
      allOf:
        - $ref: '#/components/schemas/CertificateSummary'
        - type: object
          properties:
            enrollmentId: { type: string, format: uuid }
            studentName: { type: string }
            rollNo: { type: string }
            courseTitle: { type: string }
            batchName: { type: string }
            cycleName: { type: string }
            grade: { type: string, enum: [A, B, C, D] }
            aggregatePercent: { type: number }
            attendancePercent: { type: number }
            issuedBy: { type: string }
            canReissue:
              type: boolean
              description: VALID, or REVOKED and not yet replaced (BR-19)
    CompletionRow:
      type: object
      properties:
        enrollmentId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        rollNo: { type: string }
        fullName: { type: string }
        status: { type: string }
        reason: { type: string, nullable: true }
        eligible: { type: boolean }
        checks: { type: array, items: { $ref: '#/components/schemas/EligibilityCheck' } }
        attendancePercent: { type: number, nullable: true }
        aggregate: { type: number, nullable: true }
        grade: { type: string, nullable: true, enum: [A, B, C, D, NOT_COMPLETED] }
        certificate:
          {
            type: object,
            nullable: true,
            allOf: [{ $ref: '#/components/schemas/CertificateSummary' }],
          }
    ApproveResult:
      type: object
      properties:
        enrollmentId: { type: string, format: uuid }
        status: { type: string, enum: [COMPLETED, CERTIFIED] }
        certificate: { $ref: '#/components/schemas/CertificateSummary' }
    AdminDashboard:
      type: object
      properties:
        counts:
          type: object
          properties:
            students: { type: integer }
            courses: { type: integer }
            trainers: { type: integer }
            batches:
              type: object
              properties:
                PLANNED: { type: integer }
                ACTIVE: { type: integer }
                CLOSED: { type: integer }
        enrollmentFunnel:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              count: { type: integer }
        completion:
          type: object
          properties:
            completed: { type: integer }
            notCompleted: { type: integer }
            inTraining: { type: integer }
            ratePercent: { type: number, nullable: true }
        grades:
          type: array
          items:
            type: object
            properties:
              grade: { type: string, enum: [A, B, C, D] }
              count: { type: integer }
        attendanceTrend:
          type: array
          items:
            type: object
            properties:
              weekStart: { type: string, format: date }
              percent: { type: number, nullable: true }
              marks: { type: integer }
        minAttendancePercent: { type: number }
    CompetencyInput:
      type: object
      required: [code, title, mode, requiredLevel, isMandatory]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,19}$' }
        title: { type: string, minLength: 3, maxLength: 160 }
        description: { type: string, nullable: true }
        mode: { type: string, enum: [THEORY, PRACTICAL] }
        requiredLevel: { type: integer, minimum: 1, maximum: 4 }
        isMandatory: { type: boolean }
        assessmentIds: { type: array, items: { type: string, format: uuid } }
    Competency:
      allOf:
        - $ref: '#/components/schemas/CompetencyInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            courseId: { type: string, format: uuid }
            resourceCount: { type: integer }
            ratingCount: { type: integer }
    ResourceInput:
      type: object
      required: [competencyId, title, type, url]
      properties:
        competencyId: { type: string, format: uuid }
        title: { type: string }
        type: { type: string, enum: [VIDEO, DOCUMENT, PRACTICE_TASK, REMEDIAL_SESSION] }
        url: { type: string, format: uri }
    PublicVerification:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        course: { type: string }
        grade: { type: string, enum: [A, B, C, D] }
        issueDate: { type: string, format: date }
        status: { type: string, enum: [VALID, REVOKED, SUPERSEDED] }
        revokedOn: { type: string, format: date, nullable: true }
  responses:
    TooManyRequests:
      description: Rate limited or account locked
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Role or ownership check failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Business rule conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: Input failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
security:
  - bearerAuth: []
